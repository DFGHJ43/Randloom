[package]
name = "randloom"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Interactive terminal random number generator"
default-run = "randloom"

[lib]
name = "randloom"
path = "src/lib.rs"

[[bin]]
name = "randloom"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[dev-dependencies]
insta = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
strip = true
